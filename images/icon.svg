<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#231a42"/>
      <stop offset="0.55" stop-color="#12101f"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </radialGradient>
    <linearGradient id="v" gradientUnits="userSpaceOnUse" x1="58" y1="80" x2="182" y2="190">
      <stop offset="0" stop-color="#c678dd"/>
      <stop offset="0.5" stop-color="#e06c9f"/>
      <stop offset="1" stop-color="#61afef"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d58f"/>
      <stop offset="1" stop-color="#d19a66"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <mask id="crescent">
      <circle cx="198" cy="58" r="20" fill="#fff"/>
      <circle cx="208" cy="51" r="17" fill="#000"/>
    </mask>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="56" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="246.5" height="246.5" rx="55.25" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- stars -->
  <circle cx="52" cy="50" r="2.6" fill="#fff" opacity="0.75"/>
  <circle cx="122" cy="40" r="1.7" fill="#fff" opacity="0.5"/>
  <circle cx="160" cy="92" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="212" cy="122" r="2" fill="#fff" opacity="0.55"/>
  <circle cx="36" cy="150" r="1.4" fill="#fff" opacity="0.35"/>

  <!-- crescent moon -->
  <circle cx="196" cy="60" r="26" fill="#e5c07b" opacity="0.22" filter="url(#glow)"/>
  <rect x="170" y="30" width="60" height="60" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- V monogram -->
  <path d="M64 84 L118 188 L172 84" fill="none" stroke="url(#v)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" filter="url(#glow)"/>
  <path d="M64 84 L118 188 L172 84" fill="none" stroke="url(#v)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 82 L96 151" stroke="#fff" stroke-opacity="0.2" stroke-width="5" stroke-linecap="round"/>

  <!-- terminal cursor -->
  <rect x="172" y="179" width="36" height="12" rx="6" fill="#98c379" opacity="0.5" filter="url(#glow)"/>
  <rect x="172" y="179" width="36" height="12" rx="6" fill="#98c379"/>
</svg>
